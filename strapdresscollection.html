<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puff Dress Collection - FeyCo.</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.css"/>
  
  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body { margin: 0; background-color: #fff; }
    .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
    
    header { text-align: center; margin-bottom: 30px; }
    header img { width: 80px; height: auto; }
    header h1 { margin: 15px 0 5px 0; letter-spacing: 2px; }
    header p { color: #666; margin: 0; }
    
    /* Navigation Bar Styling */
    .nav-bar {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 25px;
      margin-top: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid #eee;
    }
    .nav-bar a {
      color: #333;
      text-decoration: none;
      font-weight: bold;
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: color 0.2s ease;
    }
    .nav-bar a:hover, .nav-bar a.active {
      color: #c0392b;
    }

    .back-btn { display: inline-block; margin-bottom: 20px; color: #222; text-decoration: none; font-weight: bold; }
    
    /* Grid layout with capped card dimensions */
    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(280px, 320px)); 
      justify-content: center; 
      gap: 25px; 
      margin-top: 30px;
    }

    .card { 
      border: 1px solid #eee; 
      border-radius: 16px; 
      padding: 15px; 
      text-align: center; 
      background: #fff; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
    }

    /* Full-image view without cropping */
    .card img { 
      width: 100%; 
      height: 420px; 
      border-radius: 12px; 
      object-fit: cover;
      object-position: top center; 
      display: block; 
    }

    .card h2 { font-size: 18px; margin: 12px 0 6px 0; color: #222; }
    .price { color: #c0392b; font-weight: bold; margin-bottom: 8px; }
    .details { color: #555; font-size: 14px; margin: 4px 0; }
    .btn { display: inline-block; background-color: #222; color: #fff; padding: 10px 20px; border-radius: 20px; text-decoration: none; margin-top: 12px; font-size: 14px; font-weight: bold; }
    
    .hidden-gallery-link { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <a href="index.html" class="back-btn">← Back to All Collections</a>

  <header>
    <img src="FeyCoLogo.PNG" alt="Fey Co. Logo">
    
    <nav class="nav-bar">
      <a href="index.html" class="active">HOME</a>
      <a href="https://m.me/j/YOUR_MESSENGER_COMMUNITY_LINK/" target="_blank">COMMUNITY</a>
      <a href="https://www.tiktok.com/@YOUR_TIKTOK_USERNAME" target="_blank">WHEN WORN</a>
    </nav>

    <h1>STRAPPY DRESS COLLECTION</h1>
    <p>Rent your dream dress</p>
  </header>

  <div class="grid">
    
    <!-- Elsa Strap Dress Card -->
    <div class="card">
      <a href="Elsa.jpg" data-fancybox="Elsa-gallery" data-caption="Elsa When Worn">
        <img src="Elsa.jpg" alt="Elsa When Worn">
      </a>
      <a href="Elsa2.JPG" data-fancybox="Elsa-gallery" data-caption="Elsa Dress" class="hidden-gallery-link"></a>
      
      <h2>Elsa</h2>
      <div class="price">₱280</div>
      <p class="details">Fabric | Design: Seqeuins</p>
      <p class="details">Size: S-M | Regular fit</p>
      <p class="details">Rent Days: 3</p>
      <p class="details">Color: Blue</p>
      <a href="https://www.facebook.com/share/1DNiAmbiKs/?mibextid=wwXIfr" class="btn" target="_blank">Reserve / Rent Now</a>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.umd.js"></script>
<script>Fancybox.bind("[data-fancybox]", {});</script>

</body>
</html>
