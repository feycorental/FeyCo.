<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strap Dress Collection - FeyCo.</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.css"/>
  
  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body { margin: 0; background-color: #fff; }
    .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
    
    header { text-align: center; margin-bottom: 30px; }
    header img { width: 80px; height: auto; }
    header h1 { margin: 15px 0 5px 0; letter-spacing: 2px; }
    header p { color: #666; margin: 0; }
    
    /* Navigation Bar Styling */
    .nav-bar {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 25px;
      margin-top: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid #eee;
    }
    .nav-bar a {
      color: #333;
      text-decoration: none;
      font-weight: bold;
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: color 0.2s ease;
    }
    .nav-bar a:hover {
      color: #c0392b;
    }

    .back-btn { display: inline-block; margin-bottom: 20px; color: #222; text-decoration: none; font-weight: bold; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
    .card { border: 1px solid #eee; border-radius: 16px; padding: 15px; text-align: center; background: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    
    /* Updated Image Display: Prevents Cropping */
    .card img { 
      width: 100%; 
      height: 350px; 
      border-radius: 12px; 
      object-fit: contain; 
      background-color: #f9f9f9; 
      display: block; 
    }

    .card h2 { font-size: 18px; margin: 12px 0 6px 0; color: #222; }
    .price { color: #c0392b; font-weight: bold; margin-bottom: 8px; }
    .details { color: #555; font-size: 14px; margin: 4px 0; }
    
    /* Button Group Styling */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 15px;
    }

    .btn-reserve, .btn-rent {
      display: block;
      width: 100%;
      text-align: center;
      padding: 10px 0;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
      text-decoration: none;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }

    /* Primary Dark Button for Messenger */
    .btn-rent {
      background-color: #222222;
      color: #ffffff;
      border: 1px solid #222222;
    }

    .btn-rent:hover {
      background-color: #444444;
    }

    /* Secondary Outline Button for Calendly */
    .btn-reserve {
      background-color: transparent;
      color: #222222;
      border: 1px solid #222222;
    }

    .btn-reserve:hover {
      background-color: #222222;
      color: #ffffff;
    }
    
    .hidden-gallery-link { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <a href="index.html" class="back-btn">← Back to All Collections</a>

  <header>
    <img src="FeyCoLogo.PNG" alt="Fey Co. Logo">
    
    <!-- Navigation Menu -->
    <nav class="nav-bar">
      <a href="index.html" class="active">HOME</a>
      <a href="https://www.tiktok.com/@feycorental" target="_blank">GUIDELINES</a>
      <a href="https://www.facebook.com/FeyCoRental" target="_blank">FACEBOOK PAGE</a>
      <a href="">TIKTOK?</a>
    </nav>

    <h1>STRAP DRESS COLLECTION</h1>
    <p>Explore our beautiful strap dress options</p>
  </header>

  <div class="grid">
    
    <!-- Elsa Strap Dress -->
    <div class="card">
      <a href="Elsa.jpg" data-fancybox="Elsa-gallery" data-caption="Elsa Dress Front">
        <img src="Elsa.jpg" alt="Elsa Dress">
      </a>
      <a href="Elsa2.jpg" data-fancybox="Elsa-gallery" data-caption="Elsa Dress Back" class="hidden-gallery-link"></a>

      <h2>Elsa</h2>
      <div class="price">₱280</div>
      <p class="details">Fabric | Design: Sequeins</p>
      <p class="details">Size: S-M | Regular fit</p>
      <p class="details">Color: Blue</p>
      <p class="details">Rent Days: 3</p>
      
      <div class="button-group">
        <a href="https://calendly.com/feyco-business/fitting-schedule" target="_blank" class="btn-reserve">RESERVE FITTING</a>
        <a href="https://m.me/FeyCoRental" target="_blank" class="btn-rent">RENT NOW</a>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.umd.js"></script>
<script>Fancybox.bind("[data-fancybox]", {});</script>

</body>
</html>
