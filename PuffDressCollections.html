<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puff Dress Collection | Fey Co.</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #111111;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Top Navigation */
    .top-bar {
      margin-bottom: 20px;
    }

    .back-link {
      text-decoration: none;
      color: #333333;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .logo-container {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo-text {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 2px;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 30px;
      border-bottom: 1px solid #eeeeee;
      padding-bottom: 15px;
    }

    nav a {
      text-decoration: none;
      color: #555555;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    nav a.active {
      color: #cc5544;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 1.8rem;
      letter-spacing: 2px;
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    header p {
      color: #666666;
      font-size: 0.9rem;
    }

    /* Product Grid / Card */
    .product-card {
      border: 1px solid #eeeeee;
      border-radius: 16px;
      padding: 24px;
      max-width: 500px;
      margin: 0 auto;
      text-align: center;
      background: #ffffff;
    }

    .product-card img {
      width: 100%;
      height: 380px;
      object-fit: contain; /* Shows full dress without cropping */
      border-radius: 12px;
      margin-bottom: 15px;
      background-color: #fafafa;
    }

    .product-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .product-price {
      color: #cc5544;
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 12px;
    }

    .product-details {
      font-size: 0.85rem;
      color: #555555;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-block;
      width: 100%;
      padding: 12px 0;
      background-color: #111111;
      color: #ffffff;
      text-decoration: none;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background-color: #333333;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="top-bar">
      <a href="index.html" class="back-link">&larr; Back to All Collections</a>
    </div>

    <!-- Logo -->
    <div class="logo-container">
      <div class="logo-text">FC</div>
    </div>

    <!-- Navigation Menu -->
    <nav>
      <a href="index.html">HOME</a>
      <a href="#">COMMUNITY</a>
      <a href="#">WHEN WORN</a>
    </nav>

    <!-- Header Title -->
    <header>
      <h1>PUFF DRESS COLLECTION</h1>
      <p>Rent your dream dress</p>
    </header>

    <!-- Single Item Card -->
    <div class="product-card">
      <img src="https://images.unsplash.com/photo-1572804013309-59a88b7e92f1?q=80&w=800&auto=format&fit=crop" alt="Belle Puff Dress">
      
      <div class="product-title">Belle Puff Dress</div>
      <div class="product-price">&#8369;350 / 3 Days</div>
      
      <div class="product-details">
        Fabric/Design: Premium Silk<br>
        Regular fit<br>
        Size: S - M
      </div>

      <a href="https://www.facebook.com/1DNiAmbiKs" class="btn" target="_blank">Reserve / Rent Now</a>
    </div>

  </div>

</body>
</html>
