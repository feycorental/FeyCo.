<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FeyCo. Dress Rental</title>
  
  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body { margin: 0; background-color: #fff; }
    .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
    
    header { text-align: center; margin-bottom: 30px; }
    header img { width: 80px; height: auto; }
    header h1 { margin: 10px 0 5px 0; letter-spacing: 2px; }
    header p { color: #666; margin: 0; }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
    }
    
    .card {
      border: 1px solid #eee;
      border-radius: 16px;
      padding: 15px;
      text-align: center;
      background: #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      transition: transform 0.2s ease;
    }
    .card:hover { transform: translateY(-5px); }
    .card img {
      width: 100%;
      height: 350px;
      border-radius: 12px;
      object-fit: cover;
    }
    .card h2 { font-size: 20px; margin: 15px 0 10px 0; color: #222; }
    
    .btn {
      display: inline-block;
      background-color: #222;
      color: #fff;
      padding: 10px 22px;
      border-radius: 20px;
      text-decoration: none;
      margin-top: 5px;
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container">
  
  <header>
    <img src="FeyCoLogo.PNG" alt="Fey Co. Logo">
    <h1>FEY CO. DRESS RENTAL</h1>
    <p>Rent your dream dress in affordable price.</p>
  </header>

  <div class="grid">
    
    <!-- Collection 1: Strappy Dresses -->
    <div class="card">
      <a href="strapdresscollection.html" style="text-decoration: none;">
        <img src="Elsa.jpg" alt="Strappy Dress Collection">
        <h2>STRAPPY DRESS COLLECTION</h2>
        <span class="btn">Browse Collection</span>
      </a>
    </div>

    <!-- Collection 2: Corset Dresses -->
    <div class="card">
      <a href="corsetdresscollections.html" style="text-decoration: none;">
        <img src="Odette2.jpg" alt="Corset Dress Collection">
        <h2>CORSET DRESS COLLECTION</h2>
        <span class="btn">Browse Collection</span>
      </a>
    </div>

    <!-- Collection 3: Puff Dresses -->
    <div class="card">
      <a href="PuffDressCollections.html" style="text-decoration: none;">
        <img src="Penelope3.jpg" alt="Puff Dress Collection">
        <h2>PUFF DRESS COLLECTION</h2>
        <span class="btn">Browse Collection</span>
      </a>
    </div>

  </div>
</div>

</body>
</html>
